<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>🧙‍♀️ Magic Eight Ball</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(to right, #3a1c71, #d76d77, #ffaf7b);
      color: #fff;
      font-family: 'Segoe UI', sans-serif;
      padding: 2rem;
    }
    .container {
      max-width: 600px;
      margin: auto;
      background: rgba(0, 0, 0, 0.7);
      border-radius: 10px;
      padding: 2rem;
      box-shadow: 0 0 20px rgba(0,0,0,0.5);
    }
    h2 {
      text-align: center;
      margin-bottom: 1.5rem;
      font-weight: bold;
    }
    .answer {
      font-size: 1.2rem;
      margin-top: 1rem;
      background-color: #fff;
      color: #333;
      padding: 1rem;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(255,255,255,0.2);
    }
    button {
      margin-top: 1rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>🔮 Ask the Fortune Teller</h2>
    <div id="output" class="answer text-center"></div>
    <button class="btn btn-light w-100" onclick="askQuestion()">Ask a Question</button>
  </div>

  <script>
    const responses = [
      "The stars say yes.",
      "I wouldn’t count on it.",
      "Mystery surrounds that answer—try again.",
      "Absolutely! Fate has spoken.",
      "No, the universe disagrees.",
      "Signs point to yes... if you're patient.",
      "I sense uncertainty in your future.",
      "Yes—but beware the consequences."
    ];

    function askQuestion() {
      const question = prompt("Enter your yes or no question:");
      if (question === null || question.trim() === "") {
        document.getElementById("output").innerHTML = "Farewell, seeker of truth...";
        return;
      }
      const answer = responses[Math.floor(Math.random() * responses.length)];
      document.getElementById("output").innerHTML = `
        <strong>Your Question:</strong> ${question}<br>
        <strong>Magic Eight Ball says:</strong> ${answer}
      `;
      setTimeout(() => {
        if (confirm("Would you like to ask another question?")) {
          askQuestion();
        } else {
          document.getElementById("output").innerHTML = "Your destiny is now in motion...";
        }
      }, 500);
    }
  </script>
</body>
</html>
